name: verify

# Upstream's `.github/workflows/build.yml` has been removed from this tree
# rather than left beside this file.  It drove a CMake configure that downloads
# Abseil, googletest and Google Benchmark, ran Bazel over upstream's workspace,
# and on a release tag published wheels to PyPI under a `pypi` environment
# configured on Google's side of the release.  That is another maintainer's
# release infrastructure and a build definition this fork replaces, so keeping
# it would have meant that publishing a tag from this repository attempted an
# upload of s2geometry wheels under it.  Nothing was repointed in its place:
# this workflow already runs every mandatory gate, and the Zig build is the
# only build definition in this tree.
#
# System-library mode (`zig build test -fsys=s2`, `zig build smoke -fsys=s2`,
# `zig build consumer -fsys=s2`) is deliberately not a job here.  It binds an
# installed libs2 and the Abseil it was built against, and a stock runner has
# neither, nor a package name this repository can name without guessing.  It is
# gated on a machine that has them; a claim about it needs that run, not this
# file.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"

jobs:
  provenance:
    name: licence and provenance integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the pinned upstream commits are objects in this
          # checkout and not only in the clones below. The comparison itself
          # does not use them: it takes each canonical tree from its own
          # `git archive` of the pinned commit, at a checked archive digest,
          # because that is the only form in which the reference and the
          # carried tree can be compared path by path over their whole
          # contents.
          fetch-depth: 0

      - name: Required fork records are present
        run: |
          for f in LICENSE NOTICE NOTICE.md UPSTREAM.md UPSTREAM.sha256 CHANGELOG.md FORK-NOTES.md README.zig.md; do
            test -s "$f" || { echo "missing or empty: $f" >&2; exit 1; }
          done

      - name: Immutable source, dependency, licence and fixture integrity
        run: sha256sum -c UPSTREAM.sha256

      # The two upstream trees, against their own canonical archives.
      #
      # This is deliberately not `git diff --exit-code <commit> -- src`, and
      # not a count of files carrying a notice. A zero-diff check cannot
      # express "exactly these paths and no others": it passes only when
      # nothing at all changed, and the moment one authorised portability fix
      # lands it fails on the file that fix is about. A notice count cannot
      # express it either, because a notice is text a person can move between
      # files. So each tree is extracted from a `git archive` of its pinned
      # commit, the archive digest is checked against the one recorded in
      # `UPSTREAM.md`, and the whole trees are then compared entry by entry:
      # every file, directory and symlink target, keyed by relative path.
      #
      # Four things are rejected, each of which a coarser check would miss:
      #
      #   * an extra or a missing path. The changed set must equal the
      #     disclosed set exactly, so a ninth edited file fails here even if
      #     its bytes still hash to something plausible, and a deleted or
      #     renamed path fails as loudly as an edited one.
      #   * a different edit inside a disclosed path. Each row carries the
      #     current digest this repository ships, so re-editing a file that is
      #     already disclosed fails rather than riding inside its approval.
      #   * a missing or replaced licence header. The pristine leading comment
      #     block must still be a prefix of the current one, so an edit above
      #     the notice that drops or edits the Apache-2.0 header fails.
      #   * a missing or wrong notice. Each row names the exact notice line
      #     that path carries, and the two wording variants are modelled per
      #     path rather than as one string searched across the tree: six
      #     Abseil files say "Foundation fork change (2026-10-02)", the CCTZ
      #     NetBSD guard and the S2 pointer-iterator fix say "foundation-libs
      #     portability change:". A single-variant search would accept a tree
      #     in which one path lost its notice and another path's notice was
      #     pasted in its place.
      #
      # One S2 file and seven Abseil files differ. That is the whole delta, and
      # it is the same set `UPSTREAM.sha256` and `NOTICE.md` disclose.
      - name: Both upstream trees are the pinned archives with exactly the disclosed deltas
        run: |
          set -euo pipefail
          s2_git="$RUNNER_TEMP/s2-canonical.git"
          s2_tar="$RUNNER_TEMP/s2-canonical.tar"
          s2_reference="$RUNNER_TEMP/s2-reference"
          git clone --bare --depth 1 --branch v0.14.0 https://github.com/google/s2geometry.git "$s2_git"
          git --git-dir="$s2_git" archive --format=tar --output="$s2_tar" c24b368c67d0b8a2a109c5a75224e73a856bd8b7
          printf '%s  %s\n' 6e49b320921abbf0294d783c30aad94fc73f4b04f5b8de6d3d9409024e393b20 "$s2_tar" | sha256sum -c -
          mkdir "$s2_reference"
          tar -xf "$s2_tar" -C "$s2_reference"

          absl_git="$RUNNER_TEMP/abseil-canonical.git"
          absl_tar="$RUNNER_TEMP/abseil-canonical.tar"
          absl_reference="$RUNNER_TEMP/abseil-reference"
          git clone --bare --depth 1 --branch 20250814.1 https://github.com/abseil/abseil-cpp.git "$absl_git"
          git --git-dir="$absl_git" archive --format=tar --output="$absl_tar" d38452e1ee03523a208362186fd42248ff2609f6
          printf '%s  %s\n' 8b39fdb7c4a5d7ef0ee88b0b4eb3d23c77623d6f793579a5e0d0af7cf2ce6eaa "$absl_tar" | sha256sum -c -
          mkdir "$absl_reference"
          tar -xf "$absl_tar" -C "$absl_reference"

          python3 - "$s2_reference" src "$absl_reference" vendor/abseil-cpp <<'PY'
          import hashlib
          import os
          import pathlib
          import sys

          # One row per disclosed deviation.  Each is
          #   (pristine digest, current digest, exact notice line).
          # The pristine digest is re-derived from the canonical archive
          # extracted above and compared, so the row cannot silently describe
          # a different upstream than the one the archive digest pins.
          PORTABILITY = "foundation-libs portability change:"
          FORK = "Foundation fork change (2026-10-02)"
          DEVIATIONS = {
              "s2geometry src/": {
                  "s2/util/math/exactfloat/bignum.cc": (
                      "e00b9e178322bba37a8f3352937c94b9c3a295ee87c5eeecf3e4fa553f17d6f3",
                      "89a2379f0aa5c3c1ac20a6c98b18718bf637d825d249da2befa5091943fdad16",
                      "// " + PORTABILITY + " pass the string view's character",
                  ),
              },
              "bundled Abseil LTS 20250814.1": {
                  "absl/base/internal/direct_mmap.h": (
                      "33249311c9aac7271dc7195ef302379c8432f8cd0c5e6fdbe5aafbeac8ddadfc",
                      "37f3fa7e9e6acba3046930036345de8615ee14f4103471df1bc226a0f4242b8b",
                      "// " + FORK + ": Hexagon mmap2 uses 4096-byte units.",
                  ),
                  "absl/base/internal/low_level_alloc.cc": (
                      "cfa1546c5749b1028f69413cfa9a7ccc29908c9878cd3f899405853ef9afdf83",
                      "dff2cfb7a3d22c8104feb4ae7a08172f65d79c2531b34a77663c546da87dcd6f",
                      "// " + FORK + ": WASI allocates aligned backing regions",
                  ),
                  "absl/base/internal/low_level_alloc.h": (
                      "0f7dd074b79f49b57c2491987e722dbc0301018937e2a0573e10b3df8afe0649",
                      "b48b92d95dc4ae645dbcaf523e738748fadf5a0f1d957e7026c3facad6a6e275",
                      "// " + FORK + ": WASI uses the SDK's aligned libc heap",
                  ),
                  "absl/debugging/internal/examine_stack.cc": (
                      "7f6754bffa6686271cbc5fbaff95056e0016368ec295bc022b90ca20c4ad6686",
                      "023ab11ffbb0ee50a824f2bac8ea7bc54cbd290e006ae6ad51ecdd4c39120869",
                      "// " + FORK + ": fix musl PPC32 and Linux Hexagon context.",
                  ),
                  "absl/debugging/internal/stacktrace_powerpc-inl.inc": (
                      "df1dac69f431ff5e080308315fd91df3a9b929926d60d5db8808023ba38d2ada",
                      "326164d309baead8730413482124c3a3dd3cce5dfdf57efbd92d84514a512517",
                      "// " + FORK + ": use Linux PPC32 musl gregs layout.",
                  ),
                  "absl/log/internal/conditions.h": (
                      "e4c12622cb1fc6ef8ca787ec09bb58f75543ce14a0f75dca5d55efa888c16c8f",
                      "ee002cb5b86814591560e97ac77c32759f9a668fe3a828f0d907ce53c72b5a16",
                      "// " + FORK + ": hosted Hexagon uses unistd.h for _exit.",
                  ),
                  "absl/time/internal/cctz/src/time_zone_format.cc": (
                      "6bd73b0e64b5920410232c45957c62136a94e1fdc4c18b030db3f547bab05493",
                      "65a4efb9f0e8a3d3b8a5b21f3dd3e04c74479f385c1159b946b065bd6b5fe436",
                      "// " + PORTABILITY + " preserve NetBSD's native locale",
                  ),
              },
          }

          # A notice has to be prominent to be a notice under Apache-2.0
          # section 4(b), and a line buried a few hundred lines into a
          # translation unit is not. Every disclosed path places its notice
          # within its first 22 lines; the bound is set above that with room
          # to spare, so it rejects a notice that was moved out of the header
          # and not one whose wording was set.
          PROMINENT_WITHIN = 40

          def inventory(root):
              result = {}
              for base, dirs, files in os.walk(root, followlinks=False):
                  for name in dirs + files:
                      path = pathlib.Path(base) / name
                      key = str(path.relative_to(root))
                      if path.is_symlink():
                          result[key] = ("symlink", os.readlink(path))
                      elif path.is_file():
                          result[key] = ("file", hashlib.sha256(path.read_bytes()).hexdigest())
                      elif path.is_dir():
                          result[key] = ("directory",)
                      else:
                          raise SystemExit("unexpected file type: " + key)
              return result

          def licence_block(text):
              """The leading run of comment lines: the copyright and licence
              header.  Its length is defined by the pristine file, so a
              current file that keeps the header and adds a notice below it
              still matches."""
              block = []
              for line in text.splitlines():
                  if not line.startswith("//"):
                      break
                  block.append(line)
              return block

          s2_reference, s2_tree, absl_reference, absl_tree = (
              pathlib.Path(value) for value in sys.argv[1:])
          checked = 0
          for label, reference, tree in (
                  ("s2geometry src/", s2_reference / "src", s2_tree),
                  ("bundled Abseil LTS 20250814.1", absl_reference, absl_tree)):
              expected = DEVIATIONS[label]
              before, after = inventory(reference), inventory(tree)
              changed = {key for key in before.keys() | after.keys()
                         if before.get(key) != after.get(key)}
              if changed != set(expected):
                  raise SystemExit(
                      "unapproved " + label + " delta: extra "
                      + repr(sorted(changed - set(expected))) + ", missing "
                      + repr(sorted(set(expected) - changed)))
              for key in sorted(expected):
                  pristine, current, notice = expected[key]
                  where = label + " " + key
                  if before[key] != ("file", pristine):
                      raise SystemExit(
                          "canonical " + where
                          + " is not the pinned upstream file: " + repr(before[key]))
                  if after[key] != ("file", current):
                      raise SystemExit("edited bytes inside a disclosed path: " + where)
                  pristine_text = (reference / key).read_text()
                  current_text = (tree / key).read_text()
                  header = licence_block(pristine_text)
                  if licence_block(current_text)[:len(header)] != header:
                      raise SystemExit(
                          "licence/copyright header altered or removed: " + where)
                  lines = current_text.splitlines()
                  at = [number for number, line in enumerate(lines, 1)
                        if line == notice]
                  if not at:
                      raise SystemExit("missing change notice: " + where)
                  if min(at) > PROMINENT_WITHIN:
                      raise SystemExit(
                          "change notice is not prominent (line " + str(min(at))
                          + "): " + where)
                  checked += 1
          print("exact " + str(checked) + "-file native source delta verified: "
                "1 s2geometry file, 7 Abseil files, no other path changed")
          PY

  native:
    name: native ${{ matrix.job }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: build
            flags: ""
          - job: test-debug
            flags: "test"
          - job: test-release-safe
            flags: "test -Doptimize=ReleaseSafe"
          - job: smoke
            flags: "smoke"
          - job: check
            flags: "check"
          - job: consumer
            flags: "consumer"
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: zig build ${{ matrix.job }}
        run: zig build ${{ matrix.flags }} -j8 --summary all

  # Two programs that live entirely outside the build graph and are compiled
  # against what `zig build` installed.  Nothing here can see the Zig facade,
  # the translated C module or the build's own include paths: a translation
  # unit that `#include <s2geometry_bridge.h>` and one that `#include
  # <s2/s2cell_id.h>` see only `zig-out/include` and link only
  # `zig-out/lib`, which is the whole point of installing a package.
  installed-consumers:
    name: installed C bridge and native C++ consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # This is what produces `zig-out`: the three static archives, the bridge
      # header, and the whole of the upstream `s2` and `absl` header trees.
      - name: Build and install
        run: zig build -j8 --summary all

      # A C consumer of the installed bridge, reached the way a C program
      # reaches it: the one installed public header, the three installed
      # archives, and no Zig code.  A declaration whose type is wrong fails to
      # compile; a declaration the bridge archive does not define fails to
      # link; a rejected argument that still wrote its out parameter fails at
      # run time.
      #
      # Every expected value is fixed by hand here, from the id layout in
      # `src/s2/s2cell_id.h` and from the geometry of a spherical octant --
      # not read out of a previous run.  Where an independent implementation
      # has published the same number, this file names it:
      # `testdata/golang_cellid_tokens.tsv` carries golang/geo's own decodings
      # of the tokens "1" (0x1000000000000000), "3" (0x3000000000000000) and
      # "14" (0x1400000000000000), and its malformed-token table lists
      # "876[ee99" as an input the codec must reject.
      #
      # The three archives are named in the order they depend on -- the bridge
      # calls into S2, S2 calls into Abseil -- and `-lc++` is here for the
      # same reason build.zig puts `link_libcpp` on every artifact: the
      # archives are compiled from C++ and carry C++ runtime references.  A C
      # driver does not link libc++ on its own.
      - name: installed C bridge compiles, links and runs
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/c_bridge_consumer.c" <<'C'
          /* The installed C bridge, reached the way a C program reaches it:
           * the one installed public header, the three installed archives,
           * and no Zig code.
           *
           * Every expected value below is fixed by hand from the id layout
           * in `src/s2/s2cell_id.h` and from the geometry of a spherical
           * octant.  Where an independent implementation has published the
           * same number, the comment says which.
           */
          #include <s2geometry_bridge.h>

          #include <inttypes.h>
          #include <math.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>

          /* pi written out rather than taken from a header macro: this file
           * is compiled as strict C11, where glibc's math.h need not define
           * M_PI. */
          static const double kPi = 3.14159265358979323846;

          int main(void) {
            /* A level-0 cell id is (face << 61) | (1 << 60): three face bits
             * (kFaceBits, s2/s2cell_id.h:97), sixty position bits and one
             * trailing bit (kPosBits = 2*kMaxLevel + 1, :101), and a face
             * cell's lowest set bit is lsb_for_level(0) = 1 << 60
             * (:500-502).  Face 0 is an all-zero face field, so the id is
             * 1 << 60, and face f is f << 61.  The golang/geo fixture
             * decodes "1" to 0x1000000000000000 and "3" to
             * 0x3000000000000000. */
            static const uint64_t kFace0 = UINT64_C(0x1000000000000000);
            static const uint64_t kFace1 = UINT64_C(0x3000000000000000);

            /* child(p) is id_ + (2p + 1 - 4) * (lsb >> 2)
             * (s2/s2cell_id.h:675-684) and a face-0 cell has lsb == 1 << 60,
             * so the level-1 children are 1 << 60 + (2p - 3) * 2^58.
             * child_begin(1) is lsb_for_level(1) = 2^58 above id_ - lsb()
             * (:693-698) and child_end(1) (:707-712) is the exclusive end, so
             * the two-pass list below walks exactly these four.  The p == 2
             * one is the golang/geo fixture's "14". */
            static const uint64_t kLevel1[4] = {
                UINT64_C(0x0400000000000000), UINT64_C(0x0C00000000000000),
                UINT64_C(0x1400000000000000), UINT64_C(0x1C00000000000000),
            };

            /* range_min and range_max are id_ -/+ (lsb - 1)
             * (s2/s2cell_id.h:640-646).  The face-0 root's lowest set bit
             * is lsb_for_level(0) = 1 << 60 (:500-502), so its range is the
             * first and last leaf id on the face: 2^60 - (2^60 - 1) == 1
             * and 2^60 + (2^60 - 1) == 2^61 - 1 == 0x1FFFFFFFFFFFFFFF.
             * A leaf id is odd -- the level marker of a level-30 cell is
             * bit 0 (kPosBits = 2*kMaxLevel + 1, :101) -- so the range runs
             * to the largest odd id below 2^61, not to a 33-bit number. */
            static const uint64_t kRangeMin = UINT64_C(1);
            static const uint64_t kRangeMax = UINT64_C(0x1FFFFFFFFFFFFFFF);

            /* The three positive axes.  Each pair is 90 degrees apart, so
             * each interior angle is a right angle and the spherical excess
             * is 3*(pi/2) - pi = pi/2 steradians; each of the three edges is
             * a quarter great circle, so the perimeter is 3*(pi/2) radians.
             * The loop is wound so the interior is the octant around
             * (1,1,1)/sqrt(3). */
            static const double kOctant[9] = {1, 0, 0, 0, 1, 0, 0, 0, 1};
            const double kCentre = 1.0 / sqrt(3.0);

            /* Both handles are owned by the library from the moment their
             * create call returns until the destroy at the bottom, which
             * every exit path reaches.  kOctant is the opposite: the bridge
             * borrows it for the duration of the create call and copies it
             * there, so it is never passed to a destroy. */
            S2BridgeLoop *loop = NULL;
            S2BridgePolygon *polygon = NULL;
            uint64_t id = 0, out = 0, built = 0, parent = 0;
            uint64_t lo = 0, hi = 0, nxt = 0, cover = 0, kids[4], tight[3];
            size_t count = 0, cover_count = 0, token_len = 0;
            char token[17];
            double xyz[3], cell_lat = 0.0, cell_lng = 0.0;
            double cell_area = 0.0, avg_area = 0.0;
            double loop_area = 0.0, signed_area = 0.0, perimeter = 0.0;
            double poly_area = 0.0, poly_lat = 0.0, poly_lng = 0.0;
            int level = -1, face = -1, flag = -1;
            int n_loop = -1, n_loops = -1, n_poly = -1;
            int b_centre = -1, b_antipode = -1;
            int st_token = -1, st_parent = -1, st_short = -1, st_null = -1;
            int i, status = 0;

          #define FAIL(n) do { status = (n); goto done; } while (0)

            if (s2br_cell_from_face(0, &id) != S2BRIDGE_OK) FAIL(1);
            if (id != kFace0) FAIL(2);
            if (!s2br_cell_is_valid(id)) FAIL(3);
            if (!s2br_cell_is_face(id)) FAIL(4);
            if (s2br_cell_level(id, &level) != S2BRIDGE_OK || level != 0) FAIL(5);
            if (s2br_cell_face(id, &face) != S2BRIDGE_OK || face != 0) FAIL(6);

            /* A cell centre is the (0,0) of its face's (u,v) square
             * (s2/s2cell_id.h:553-579), and face 0 maps (u,v) to (1,u,v)
             * (s2/s2coords.h:371), so the centre of face 0 is the unit
             * vector (1, 0, 0) at latitude and longitude zero. */
            if (s2br_cell_to_point(id, xyz) != S2BRIDGE_OK) FAIL(7);
            if (fabs(xyz[0] - 1.0) > 1e-15 || fabs(xyz[1]) > 1e-15 ||
                fabs(xyz[2]) > 1e-15) {
              FAIL(8);
            }
            if (s2br_cell_to_lat_lng_deg(id, &cell_lat, &cell_lng) != S2BRIDGE_OK) FAIL(9);
            if (fabs(cell_lat) > 1e-12 || fabs(cell_lng) > 1e-12) FAIL(10);

            /* The six cube faces tile the sphere, so each is 4*pi/6
             * steradians.  S2Cell::ExactArea sums the areas of the cell's
             * four projected vertices (s2/s2cell.cc:143-152) and
             * S2::kAvgArea is the closed form 4*pi/6 (s2/s2metrics.cc:114):
             * two unrelated computations of one number, and six of them
             * have to fill 4*pi. */
            if (s2br_cell_exact_area(id, &cell_area) != S2BRIDGE_OK) FAIL(11);
            if (fabs(cell_area - 4.0 * kPi / 6.0) > 1e-12) FAIL(12);
            if (s2br_cell_average_area(0, &avg_area) != S2BRIDGE_OK) FAIL(13);
            if (fabs(avg_area - cell_area) > 1e-12) FAIL(14);
            if (fabs(6.0 * cell_area - 4.0 * kPi) > 1e-12) FAIL(15);

            if (s2br_cell_range(id, &lo, &hi) != S2BRIDGE_OK) FAIL(16);
            if (lo != kRangeMin || hi != kRangeMax) FAIL(17);

            /* next() is id_ + 2 * lsb (s2/s2cell_id.h:714-716), so the cell
             * after the face-0 root along the Hilbert curve is the face-1
             * root, and prev() walks back. */
            if (s2br_cell_next(id, &nxt) != S2BRIDGE_OK || nxt != kFace1) FAIL(18);
            if (s2br_cell_prev(nxt, &out) != S2BRIDGE_OK || out != kFace0) FAIL(19);

            /* ToToken prints the id in hex with trailing zero *nibbles*
             * stripped (s2/s2cell_id.cc:217-233): the face-0 root's lowest
             * set bit is bit 60, so 60/4 = 15 zero nibbles are stripped and
             * the one digit left is "1".  The codec reads it back. */
            if (s2br_cell_to_token(id, token, sizeof token, &token_len) != S2BRIDGE_OK) FAIL(20);
            if (token_len != 1 || strcmp(token, "1") != 0) FAIL(21);
            if (s2br_cell_from_token("1", 1, &out) != S2BRIDGE_OK || out != kFace0) FAIL(22);

            /* An ordinary rejection.  '[' is not a hex digit, so upstream's
             * codec answers S2CellId::None() (s2/s2cell_id.cc:246-250) and
             * the bridge reports S2BRIDGE_INVALID_ARGUMENT rather than a
             * valid id 0.  "876[ee99" is the published malformed row in
             * testdata/golang_cellid_tokens.tsv.  A rejected argument writes
             * nothing, so the sentinel has to survive it. */
            out = UINT64_C(0xDEADBEEF);
            st_token = s2br_cell_from_token("876[ee99", 8, &out);
            if (st_token != S2BRIDGE_INVALID_ARGUMENT) FAIL(23);
            if (out != UINT64_C(0xDEADBEEF)) FAIL(24);

            /* parent(level) above the cell's own level is the precondition
             * upstream documents (s2/s2cell_id.h:322-325); asking the face-0
             * root for its level-1 parent is that rejection, reported. */
            st_parent = s2br_cell_parent(id, 1, &out);
            if (st_parent != S2BRIDGE_INVALID_ARGUMENT) FAIL(25);

            /* The two-pass list contract: a NULL buffer learns the count, a
             * short buffer is reported as too small with the count it
             * needed, and the exact buffer returns the cells. */
            if (s2br_cell_children(id, 1, NULL, 0, &count) != S2BRIDGE_OK) FAIL(26);
            if (count != 4) FAIL(27);
            count = 0;
            st_short = s2br_cell_children(id, 1, tight, 3, &count);
            if (st_short != S2BRIDGE_BUFFER_TOO_SMALL) FAIL(28);
            /* The required length is still reported on the too-small path;
             * a bridge that zeroed it would make a caller unable to size
             * its retry. */
            if (count != 4) FAIL(29);
            if (s2br_cell_children(id, 1, kids, 4, &count) != S2BRIDGE_OK) FAIL(30);
            if (count != 4) FAIL(31);
            for (i = 0; i < 4; ++i) {
              if (kids[i] != kLevel1[i]) FAIL(32);
              if (s2br_cell_from_face_pos_level(0, (uint64_t)i << 59, 1, &built) != S2BRIDGE_OK) FAIL(33);
              if (built != kLevel1[i]) FAIL(34);
              if (s2br_cell_parent(kLevel1[i], 0, &parent) != S2BRIDGE_OK) FAIL(35);
              if (parent != kFace0) FAIL(36);
              if (s2br_cell_face(kLevel1[i], &face) != S2BRIDGE_OK || face != 0) FAIL(37);
              /* contains() is range_min <= other <= range_max
               * (s2/s2cell_id.h:648-652): a level-1 child is inside the face
               * root, and the face root is inside none of its children. */
              if (s2br_cell_contains(id, kLevel1[i], &flag) != S2BRIDGE_OK || flag != 1) FAIL(38);
              if (s2br_cell_contains(kLevel1[i], id, &flag) != S2BRIDGE_OK || flag != 0) FAIL(39);
            }

            /* Upstream's own covering of a cell is that one cell
             * (s2/s2region_coverer_test.cc:84-86), and a level-0 region with
             * max_level 0 admits no other cell. */
            {
              const S2BridgeCovererOptions opts = {0, 0, 1, 8};
              cover_count = 0;
              if (s2br_coverer_covering_cell(id, &opts, NULL, 0, &cover_count) != S2BRIDGE_OK) FAIL(40);
              if (cover_count != 1) FAIL(41);
              cover_count = 0;
              if (s2br_coverer_covering_cell(id, &opts, &cover, 1, &cover_count) != S2BRIDGE_OK) FAIL(42);
              if (cover_count != 1 || cover != kFace0) FAIL(43);
            }

            if (s2br_loop_create(kOctant, 3, &loop) != S2BRIDGE_OK) FAIL(44);
            if (s2br_loop_num_vertices(loop, &n_loop) != S2BRIDGE_OK || n_loop != 3) FAIL(45);
            if (s2br_loop_is_valid(loop, &flag) != S2BRIDGE_OK || flag != 1) FAIL(46);
            if (s2br_loop_is_empty(loop, &flag) != S2BRIDGE_OK || flag != 0) FAIL(47);
            if (s2br_loop_is_full(loop, &flag) != S2BRIDGE_OK || flag != 0) FAIL(48);
            if (s2br_loop_is_normalized(loop, &flag) != S2BRIDGE_OK || flag != 1) FAIL(49);
            /* A loop whose interior were more than half the sphere reports
             * 4*pi - pi/2 here instead, so the area is also the winding. */
            if (s2br_loop_area(loop, &loop_area) != S2BRIDGE_OK) FAIL(50);
            if (fabs(loop_area - kPi / 2.0) > 1e-12) FAIL(51);
            if (s2br_loop_perimeter_rad(loop, &perimeter) != S2BRIDGE_OK) FAIL(52);
            if (fabs(perimeter - 3.0 * kPi / 2.0) > 1e-12) FAIL(53);
            /* GetArea folds |GetSignedArea| back into [0, 4*pi]
             * (s2/s2loop_measures.cc:51-56), so with a pi/2 unsigned area
             * the +pi/2 signed area below is the one fact, not a second
             * one: the other way round would have reported 7*pi/2. */
            if (s2br_loop_signed_area(loop, &signed_area) != S2BRIDGE_OK) FAIL(54);
            if (fabs(signed_area - kPi / 2.0) > 1e-12) FAIL(55);
            if (s2br_loop_contains_point(loop, kCentre, kCentre, kCentre, &b_centre) != S2BRIDGE_OK) FAIL(56);
            if (b_centre != 1) FAIL(57);
            if (s2br_loop_contains_point(loop, -kCentre, -kCentre, -kCentre, &b_antipode) != S2BRIDGE_OK) FAIL(58);
            if (b_antipode != 0) FAIL(59);
            /* A NULL handle is rejected, not dereferenced. */
            st_null = s2br_loop_contains_point(NULL, kCentre, kCentre, kCentre, &flag);
            if (st_null != S2BRIDGE_INVALID_ARGUMENT) FAIL(60);

            if (s2br_polygon_create(kOctant, 3, &polygon) != S2BRIDGE_OK) FAIL(61);
            if (s2br_polygon_num_loops(polygon, &n_loops) != S2BRIDGE_OK || n_loops != 1) FAIL(62);
            if (s2br_polygon_num_vertices(polygon, &n_poly) != S2BRIDGE_OK || n_poly != 3) FAIL(63);
            if (s2br_polygon_is_valid(polygon, &flag) != S2BRIDGE_OK || flag != 1) FAIL(64);
            if (s2br_polygon_area(polygon, &poly_area) != S2BRIDGE_OK) FAIL(65);
            if (fabs(poly_area - kPi / 2.0) > 1e-12) FAIL(66);
            if (s2br_polygon_contains_point(polygon, kCentre, kCentre, kCentre, &flag) != S2BRIDGE_OK || flag != 1) FAIL(67);
            if (s2br_polygon_contains_point(polygon, -kCentre, -kCentre, -kCentre, &flag) != S2BRIDGE_OK || flag != 0) FAIL(68);
            /* A shell's centroid is its loop's area-weighted centroid, and
             * the three positive axes are symmetric about (1,1,1)/sqrt(3),
             * so the centroid is that direction: latitude asin(1/sqrt(3)),
             * longitude atan2 of two equal coordinates, 45 degrees. */
            if (s2br_polygon_centroid_lat_lng_deg(polygon, &poly_lat, &poly_lng) != S2BRIDGE_OK) FAIL(69);
            if (fabs(poly_lat - asin(kCentre) * 180.0 / kPi) > 1e-9) FAIL(70);
            if (fabs(poly_lng - 45.0) > 1e-9) FAIL(71);

          done:
            /* Both destroy calls accept a NULL handle, so this runs on every
             * path above, including the ones that failed before the handle
             * existed. */
            s2br_polygon_destroy(polygon);
            s2br_loop_destroy(loop);
          #undef FAIL

            if (status != 0) {
              printf("installed C bridge consumer: check %d failed\n", status);
              return status;
            }

            printf("installed C bridge consumer\n");
            printf("  face 0 id        0x%016" PRIx64 "  token \"%s\"  level %d  face %d\n",
                   id, token, level, face);
            printf("  face 0 centre    (%.15g, %.15g, %.15g)  lat %.15g lng %.15g deg\n",
                   xyz[0], xyz[1], xyz[2], cell_lat, cell_lng);
            printf("  face 0 area      %.15g sr exact, %.15g sr average, 4pi/6 = %.15g sr\n",
                   cell_area, avg_area, 4.0 * kPi / 6.0);
            printf("  face 0 range     [0x%016" PRIx64 ", 0x%016" PRIx64 "]  next 0x%016" PRIx64 "\n",
                   lo, hi, nxt);
            printf("  level 1 children 0x%016" PRIx64 " 0x%016" PRIx64 " 0x%016" PRIx64 " 0x%016" PRIx64 "\n",
                   kids[0], kids[1], kids[2], kids[3]);
            printf("  covering         %zu cell, 0x%016" PRIx64 "\n", cover_count, cover);
            printf("  octant loop      %d vertices, area %.15g sr, signed %.15g sr, perimeter %.15g rad\n",
                   n_loop, loop_area, signed_area, perimeter);
            printf("  octant polygon   %d loop, %d vertices, area %.15g sr, centroid %.15g, %.15g deg\n",
                   n_loops, n_poly, poly_area, poly_lat, poly_lng);
            printf("  containment      (1,1,1)/sqrt3 in loop and polygon, (-1,-1,-1)/sqrt3 in neither\n");
            printf("  rejections       malformed token %d, over-level parent %d, short buffer %d, NULL handle %d (1 = invalid argument, 2 = buffer too small)\n",
                   st_token, st_parent, st_short, st_null);
            return 0;
          }
          C
          zig cc -std=c11 \
            -I zig-out/include \
            "$RUNNER_TEMP/c_bridge_consumer.c" \
            zig-out/lib/libs2bridge.a \
            zig-out/lib/libs2.a \
            zig-out/lib/libabsl.a \
            -lc++ \
            -pthread \
            -lm \
            -o "$RUNNER_TEMP/c_bridge_consumer"
          "$RUNNER_TEMP/c_bridge_consumer"

      # The other half of the install, reached independently of the bridge.
      # This translation unit includes only `<s2/...>` and `<absl/...>`,
      # links only libs2.a and libabsl.a, and calls upstream's own S2 and
      # Abseil algorithms directly -- no s2geometry_bridge.h, no Zig.  A
      # defect that only a C++ translation unit can see, such as an Abseil
      # `.inc` implementation fragment the install dropped, or an include
      # path that only the bridge's own system includes cover, cannot hide
      # behind a passing C program.
      #
      # The expected string is fixed by hand from the values below, not read
      # out of a run: face 0, the token "1", level 0, the id
      # 0x1000000000000000, and 4*pi/6 = 2.094395 to six decimal places.
      - name: installed upstream C++ and Abseil headers compile, link and run
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cxx_native_consumer.cpp" <<'CPP'
          /* The installed upstream C++ headers and the installed archives,
           * without the bridge at all.
           */
          #include <s2/s2cell.h>
          #include <s2/s2cell_id.h>
          #include <s2/s2latlng.h>
          #include <s2/s2loop.h>
          #include <s2/s2point.h>

          #include <absl/strings/str_cat.h>
          #include <absl/strings/str_format.h>

          #include <cmath>
          #include <cstdint>
          #include <cstdio>
          #include <string>
          #include <vector>

          namespace {

          constexpr double kPi = 3.14159265358979323846;

          int fail(int code, const char *what) {
            std::printf("installed C++ consumer: check %d failed (%s)\n", code, what);
            return code;
          }

          }  // namespace

          int main() {
            const double kSixthOfSphere = 4.0 * kPi / 6.0;
            const double kOctantArea = kPi / 2.0;

            /* A level-0 cell id is (face << 61) | (1 << 60)
             * (s2/s2cell_id.h:97, :101, :500-502), so face 0 is
             * 0x1000000000000000.  The token codec strips trailing zero
             * nibbles (s2/s2cell_id.cc:231-232), so the face-0 root spells
             * "1", which golang/geo's table decodes to the same id. */
            const S2CellId face0 = S2CellId::FromFace(0);
            if (face0.id() != UINT64_C(0x1000000000000000)) return fail(1, "face 0 id");
            if (!face0.is_valid() || !face0.is_face()) return fail(2, "face 0 predicates");
            if (face0.level() != 0 || face0.face() != 0) return fail(3, "face 0 level and face");
            if (face0.ToToken() != "1") return fail(4, "face 0 token");
            if (S2CellId::FromToken("1") != face0) return fail(5, "token round trip");

            /* A cell centre is the (0,0) of its face's (u,v) square and
             * face 0 maps (u,v) to (1,u,v) (s2/s2coords.h:371), so the
             * centre of face 0 is (1,0,0) at the origin of the lat/lng
             * frame. */
            const S2Point face0_pt = face0.ToPoint();
            const S2LatLng face0_ll = face0.ToLatLng();
            if (std::fabs(face0_pt[0] - 1.0) > 1e-15 || std::fabs(face0_pt[1]) > 1e-15 ||
                std::fabs(face0_pt[2]) > 1e-15) {
              return fail(6, "face 0 centre vector");
            }
            if (std::fabs(face0_ll.lat().degrees()) > 1e-12 ||
                std::fabs(face0_ll.lng().degrees()) > 1e-12) {
              return fail(7, "face 0 centre lat/lng");
            }

            /* Six cube faces tile the sphere, so each is 4*pi/6 steradians.
             * ExactArea sums the areas of the cell's four projected
             * vertices (s2/s2cell.cc:143-152); AverageArea reads a closed
             * form metric table seeded with 4*pi/6 (s2/s2metrics.cc:114).
             * Two unrelated computations of one number. */
            const S2Cell cell(face0);
            const double exact_area = cell.ExactArea();
            const double avg_area = S2Cell::AverageArea(0);
            if (std::fabs(exact_area - kSixthOfSphere) > 1e-12) return fail(8, "exact area");
            if (std::fabs(avg_area - exact_area) > 1e-12) return fail(9, "average area");
            if (std::fabs(6.0 * exact_area - 4.0 * kPi) > 1e-12) return fail(10, "six faces");

            /* A published independent known answer: golang/geo's
             * TestCellIDLatLng table (testdata/golang_cellid_latlng.tsv) fixes
             * the Nuremberg leaf cell 0x47a1cbd595522b39 at 49.703498679,
             * 11.770681595 degrees. */
            const S2CellId nuremberg = S2CellId::FromToken("47a1cbd595522b39");
            if (nuremberg.id() != UINT64_C(0x47a1cbd595522b39)) return fail(11, "token decode");
            if (nuremberg.level() != S2CellId::kMaxLevel || !nuremberg.is_leaf()) return fail(12, "leaf cell");
            const S2LatLng nn = nuremberg.ToLatLng();
            if (std::fabs(nn.lat().degrees() - 49.703498679) > 1e-9) return fail(13, "published latitude");
            if (std::fabs(nn.lng().degrees() - 11.770681595) > 1e-9) return fail(14, "published longitude");
            /* The leaf cell that contains its own centre is that cell. */
            if (S2CellId(nn) != nuremberg) return fail(15, "published round trip");

            /* Abseil doing real work on the S2 answers above: StrCat joins
             * the numbers, Hex renders the id, StrFormat lays out the line.
             * The expected string is fixed by hand from the same
             * derivations, not read out of a run. */
            const std::string head = absl::StrCat("face", face0.face(), "/ token=", face0.ToToken(), " level=", face0.level());
            const std::string id_hex = absl::StrCat(absl::Hex(face0.id(), absl::kZeroPad16));
            const std::string line = absl::StrFormat("%s id=%s area=%.6f", head, id_hex, exact_area);
            const std::string want = "face0/ token=1 level=0 id=1000000000000000 area=2.094395";
            if (line != want) {
              std::printf("  got:  %s\n  want: %s\n", line.c_str(), want.c_str());
              return fail(16, "absl line");
            }

            /* The octant through the three positive axes: three right
             * angles, so the spherical excess is 3*(pi/2) - pi = pi/2
             * steradians.  The opposite winding would report 4*pi - pi/2
             * here, so this pins the orientation as well as the size, and
             * eight of them must tile the sphere. */
            const std::vector<S2Point> octant{S2Point(1, 0, 0), S2Point(0, 1, 0), S2Point(0, 0, 1)};
            S2Loop loop(octant);
            const double loop_area = loop.GetArea();
            if (loop.num_vertices() != 3) return fail(17, "loop vertex count");
            if (std::fabs(loop_area - kOctantArea) > 1e-12) return fail(18, "loop area");
            if (std::fabs(8.0 * loop_area - 4.0 * kPi) > 1e-12) return fail(19, "eight octants");
            if (!loop.Contains(S2Point(1, 1, 1).Normalize())) return fail(20, "loop contains (1,1,1)/sqrt3");
            if (loop.Contains(S2Point(-1, -1, -1).Normalize())) return fail(21, "loop contains the antipode");

            std::printf("installed C++ consumer\n");
            std::printf("  %s\n", line.c_str());
            std::printf("  face 0 centre    (%.15g, %.15g, %.15g)  lat %.15g lng %.15g deg\n",
                        face0_pt[0], face0_pt[1], face0_pt[2], face0_ll.lat().degrees(), face0_ll.lng().degrees());
            std::printf("  nuremberg leaf   0x%016llx level %d at %.15g, %.15g deg\n",
                        static_cast<unsigned long long>(nuremberg.id()), nuremberg.level(),
                        nn.lat().degrees(), nn.lng().degrees());
            std::printf("  octant loop      %d vertices, area %.15g sr, centre contained, antipode outside\n",
                        loop.num_vertices(), loop_area);
            return 0;
          }
          CPP
          zig c++ -std=c++17 -fsized-deallocation \
            -I zig-out/include \
            "$RUNNER_TEMP/cxx_native_consumer.cpp" \
            zig-out/lib/libs2.a \
            zig-out/lib/libabsl.a \
            -pthread \
            -o "$RUNNER_TEMP/cxx_native_consumer"
          "$RUNNER_TEMP/cxx_native_consumer"

  cross:
    name: check ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - aarch64-macos-none
          - x86_64-windows-gnu
          - riscv64-linux-gnu
          - wasm32-wasi
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Compiled, never executed: no cross-arch emulator is assumed here, and
      # `zig build check` runs nothing by construction.
      #
      # All six targets are attempted without `continue-on-error`, including
      # the two that need a qualified expectation, so that a failure stays a
      # failure.
      #
      #   wasm32-wasi   This row is the STOCK target, and that is the whole
      #                 point of saying so. It runs `zig build check -Dtarget=
      #                 wasm32-wasi` with no `-Dwasi-sysroot=...`, so
      #                 `build_support/wasi_provider.Provider.init` returns
      #                 null and no SDK provider is configured at all: stock
      #                 Zig 0.16.0 wasm32-wasi libc, stock single-threaded
      #                 default, no WASIp1-threads sysroot. On THAT
      #                 configuration the stock target has no POSIX threads and
      #                 no signal support, which is why Abseil's
      #                 `synchronization` library and its cctz timezone code
      #                 have historically stopped here with
      #                 `signal.h:2:2: error: "wasm lacks signal support"`.
      #
      #                 That earlier receipt is about this stock path and
      #                 nothing else. A complete WASI SDK 34 WASIp1-threads
      #                 sysroot IS a separate, real configuration this package
      #                 supports -- real pthreads, real exception-unwinding
      #                 archives, real aligned libc allocation, and a forked
      #                 two-hunk Zig standard-library repair whose MIT terms
      #                 travel in `build_support/zig-0.16-LICENSE.txt` -- and it
      #                 is exercised on a machine that supplies that sysroot,
      #                 not by this row. So this comment no longer claims the
      #                 target has no threads in general: it names the one
      #                 configuration this job builds, and the other one is a
      #                 claim about a run this file does not make.
      #
      #                 S2's own library translation units use no
      #                 `std::thread` either way (`thread_testing.cc` and
      #                 `mutable_s2shape_index_test.cc` are not compiled here),
      #                 so the thread-bearing code is Abseil's, and whether it
      #                 compiles on this row is a gate observation.
      #   aarch64-macos-none
      #                 upstream's README Status section records a real failure
      #                 here: "On Apple M1, s2loop_measures_test fails due to
      #                 a 6% excess accumlated error", which is a runtime
      #                 numerical issue rather than a compile one.
      #
      # If a target genuinely cannot build, record the compiler output in
      # FORK-NOTES.md and name the boundary in the step that fails. Do not mark
      # it green.
      - name: zig build check -Dtarget=${{ matrix.target }}
        run: zig build check -Dtarget=${{ matrix.target }} -j8 --summary all